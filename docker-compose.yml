services:

  # ============================================================================
  # Backend — Django REST Framework
  # ============================================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  # ============================================================================
  # Frontend — Angular (dev server)
  # ============================================================================
  client:
    build:
      context: ../E-commerce-CRM-Fronted
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ../E-commerce-CRM-Fronted:/app
      - /app/node_modules
    depends_on: 
      - server


